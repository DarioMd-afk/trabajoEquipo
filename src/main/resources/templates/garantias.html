<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Garantías - My Phone</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/myphone.css}">
</head>
<body>
<nav class="navbar navbar-myphone px-4 py-3 mb-4">
    <span class="navbar-brand text-white fw-bold">📱 My Phone · Garantías e Inspección</span>
    <div class="d-flex gap-2">
        <a href="/" class="btn btn-outline-light btn-sm">Catálogo</a>
        <a href="/carrito" class="btn btn-outline-light btn-sm">Caja POS</a>
        <a href="/admin" class="btn btn-outline-warning btn-sm">Admin</a>
    </div>
</nav>

<div class="container">
    <div class="row g-4">
        <div class="col-md-4">
            <div class="card-myphone p-4">
                <h5 class="mb-3">+ Registrar garantía</h5>
                <form th:action="@{/garantias/guardar}" th:object="${nuevaGarantia}" method="post">
                    <div class="mb-2">
                        <label class="form-label small">Cliente</label>
                        <input type="text" th:field="*{cliente}" class="form-control" required>
                    </div>
                    <div class="mb-2">
                        <label class="form-label small">Código / SKU del producto</label>
                        <input type="text" th:field="*{codigoProducto}" class="form-control" placeholder="SKU-1042" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label small">Motivo / Falla</label>
                        <textarea th:field="*{motivoFalla}" class="form-control" rows="3" required></textarea>
                    </div>
                    <button type="submit" class="btn btn-amber w-100">Registrar</button>
                </form>
            </div>
        </div>

        <div class="col-md-8">
            <div class="card-myphone p-4">
                <h5 class="mb-3">Historial de garantías</h5>
                <table class="table table-myphone align-middle">
                    <thead>
                        <tr>
                            <th>Cliente</th>
                            <th>SKU</th>
                            <th>Motivo</th>
                            <th>Estado</th>
                            <th>Dictamen</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="g : ${garantias}">
                            <td th:text="${g.cliente}"></td>
                            <td th:text="${g.codigoProducto}"></td>
                            <td th:text="${g.motivoFalla}"></td>
                            <td><span class="badge bg-info" th:text="${g.estado}"></span></td>
                            <td>
                                <form th:action="@{/garantias/estado}" method="post" class="d-flex gap-1">
                                    <input type="hidden" name="id" th:value="${g.id}">
                                    <button name="estado" value="Aprobada" class="btn btn-success btn-sm">✓</button>
                                    <button name="estado" value="Rechazada" class="btn btn-danger btn-sm">✗</button>
                                </form>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(garantias)}">
                            <td colspan="5" class="text-center text-secondary py-4">No hay garantías registradas todavía.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
</body>
</html>
