<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Catálogo - My Phone</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/myphone.css}">
</head>
<body>
<nav class="navbar navbar-myphone px-4 py-3 mb-4">
    <span class="navbar-brand text-white fw-bold">📱 My Phone · Catálogo</span>
    <div class="d-flex gap-2">
        <a href="/compatibilidad" class="btn btn-outline-light btn-sm">Compatibilidad</a>
        <a href="/carrito" class="btn btn-outline-light btn-sm">Caja POS</a>
        <a href="/garantias" class="btn btn-outline-light btn-sm">Garantías</a>
        <a href="/admin" class="btn btn-outline-warning btn-sm">Admin</a>
    </div>
</nav>

<div class="container">
    <div class="d-flex flex-wrap gap-2 mb-4">
        <a href="/" class="btn btn-sm btn-outline-light">Todos</a>
        <a href="/?categoria=Fundas" class="btn btn-sm btn-outline-success">Fundas</a>
        <a href="/?categoria=Micas" class="btn btn-sm btn-outline-success">Micas</a>
        <a href="/?categoria=Fundas para audífonos" class="btn btn-sm btn-outline-success">Fundas audífonos</a>
        <a href="/?categoria=Cargadores" class="btn btn-sm btn-outline-success">Cargadores</a>
        <a href="/?categoria=Cables" class="btn btn-sm btn-outline-success">Cables</a>
        <a href="/?categoria=Bocinas" class="btn btn-sm btn-outline-success">Bocinas</a>
        <a href="/?categoria=Accesorios" class="btn btn-sm btn-outline-success">Accesorios</a>
        <a href="/?categoria=Combos" class="btn btn-sm btn-outline-warning">Combos</a>
    </div>

    <div class="row g-3">
        <div class="col-md-4" th:each="p : ${productos}">
            <div class="card-myphone p-3 h-100 d-flex flex-column justify-content-between">
                <div>
                    <span class="badge bg-success mb-2" th:text="${p.categoria}">Categoría</span>
                    <h5 th:text="${p.nombre}">Nombre</h5>
                    <p class="small text-secondary mb-1" th:text="'Compatible: ' + ${p.modelosCompatibles}"></p>
                    <p class="small text-secondary mb-2" th:text="'SKU: ' + ${p.codigoBarras} + ' · Stock: ' + ${p.stockDisponible}"></p>
                </div>
                <div class="d-flex justify-content-between align-items-center mt-2">
                    <h4 class="mb-0 text-warning" th:text="'$' + ${p.precioBase}">$0</h4>
                    <a th:href="@{/carrito(sku=${p.codigoBarras})}" class="btn btn-mint btn-sm">Vender</a>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
