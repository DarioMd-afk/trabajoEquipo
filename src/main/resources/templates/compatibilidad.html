<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Compatibilidad - My Phone</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/myphone.css}">
</head>
<body>
<nav class="navbar navbar-myphone px-4 py-3 mb-4">
    <span class="navbar-brand text-white fw-bold">📱 My Phone · Buscador de Compatibilidad</span>
    <div class="d-flex gap-2">
        <a href="/" class="btn btn-outline-light btn-sm">Catálogo</a>
        <a href="/carrito" class="btn btn-outline-light btn-sm">Caja POS</a>
        <a href="/admin" class="btn btn-outline-warning btn-sm">Admin</a>
    </div>
</nav>

<div class="container">
    <form action="/compatibilidad" method="get" class="card-myphone p-4 mb-4">
        <label class="form-label">Busca por marca o modelo de celular</label>
        <div class="d-flex gap-2">
            <input type="text" name="modelo" th:value="${modeloBuscado}" class="form-control" placeholder="Ej. iPhone 15, Galaxy S24, Universal...">
            <button type="submit" class="btn btn-amber">Buscar</button>
        </div>
    </form>

    <div class="row g-3">
        <div class="col-md-4" th:each="p : ${productos}">
            <div class="card-myphone p-3">
                <h6 th:text="${p.nombre}">Producto</h6>
                <small class="text-secondary d-block mb-2" th:text="${p.modelosCompatibles}"></small>
                <strong class="text-warning" th:text="'$' + ${p.precioBase}">$0</strong>
            </div>
        </div>
    </div>
</div>
</body>
</html>
