spring.application.name=myphone

# Conexion a MySQL (crea la BD automaticamente si no existe)
spring.datasource.url=jdbc:mysql://localhost:3306/myphone_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=admin123

# Configuracion de JPA / Hibernate (crea y actualiza tus tablas automaticamente)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Puerto donde correra la app (http://localhost:8081)
server.port=8081